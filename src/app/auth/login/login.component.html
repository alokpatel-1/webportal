<div class="login-page">
  <!-- Decorative Elements -->
  <app-decorative-elements [showFormTopCircle]="true"></app-decorative-elements>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">Welcome Back!</h1>
      <p class="login-subtitle">Sign in to continue shopping and track your orders</p>

      <form (ngSubmit)="onLogin()" class="login-form">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input autocomplete="new-user" type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email" class="form-input" required />
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input autocomplete="new-user" [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password" class="form-input" required />
            <button type="button" (click)="togglePasswordVisibility()" class="password-toggle">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" class="checkbox-input" />
            <span class="checkbox-text">Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-text">Or continue with</span>
      </div>

      <!-- Google Login -->
      <button type="button" (click)="onGoogleLogin()" class="btn-google">
        <img src="assets/svg/google.svg" alt="Google" class="google-icon">
        <span>Continue with Google</span>
      </button>

      <!-- Secure Connection -->
      <div class="secure-indicator">
        <img src="assets/svg/secure.svg" alt="Secure" class="secure-icon">
        <span>Secure & encrypted connection</span>
      </div>

      <!-- Sign Up Link -->
      <div class="signup-link">
        <span>New to ShopHub?</span>
        <a routerLink="/auth/signup" class="link">Create an account</a>
      </div>
    </div>
  </div>
</div>
