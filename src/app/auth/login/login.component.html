<div class="login-page">
  <!-- Decorative Elements -->
  <app-decorative-elements [showFormTopCircle]="true"></app-decorative-elements>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">Welcome Back!</h1>
      <p class="login-subtitle">Sign in to continue shopping and track your orders</p>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
        <!-- Email Field -->
        <div class="form-group">
          <label for="email" class="form-label">Email Address</label>
          <input autocomplete="email" type="email" id="email" formControlName="email" placeholder="Enter your email" class="form-input" [class.error]="email?.invalid && email?.touched" />
          <div *ngIf="email?.invalid && email?.touched" class="error-message">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input autocomplete="current-password" [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" placeholder="Enter your password" class="form-input" [class.error]="password?.invalid && password?.touched" />
            <button type="button" (click)="togglePasswordVisibility()" class="password-toggle">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
          <div *ngIf="password?.invalid && password?.touched" class="error-message">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
          </div>
        </div>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="rememberMe" class="checkbox-input" />
            <span class="checkbox-text">Remember me</span>
          </label>
          <a href="#" class="forgot-password">Forgot password?</a>
        </div>

        <!-- Sign In Button -->
        <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Sign In</button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-text">Or continue with</span>
      </div>

      <!-- Google Login -->
      <button type="button" (click)="onGoogleLogin()" class="btn-google">
        <img src="assets/svg/google.svg" alt="Google" class="google-icon">
        <span>Continue with Google</span>
      </button>

      <!-- Secure Connection -->
      <div class="secure-indicator">
        <img src="assets/svg/secure.svg" alt="Secure" class="secure-icon">
        <span>Secure & encrypted connection</span>
      </div>

      <!-- Sign Up Link -->
      <div class="signup-link">
        <span>New to ShopHub?</span>
        <a routerLink="/auth/signup" class="link">Create an account</a>
      </div>
    </div>
  </div>
</div>
