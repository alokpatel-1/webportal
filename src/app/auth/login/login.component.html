<div class="login-page">
  <!-- Decorative Elements -->
  <app-decorative-elements [showFormTopCircle]="true"></app-decorative-elements>

  <!-- Login Card -->
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">Welcome Back!</h1>
      <p class="login-subtitle">Sign in to continue shopping and track your orders</p>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
        <!-- Email Field -->
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" placeholder="Enter your email" />
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="email?.invalid && email?.touched">
            <span *ngIf="email?.errors?.['required']">Email is required</span>
            <span *ngIf="email?.errors?.['email']">Please enter a valid email</span>
          </mat-error>
        </mat-form-field>

        <!-- Password Field -->
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Password</mat-label>
          <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="Enter your password" />
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix type="button" (click)="togglePasswordVisibility()" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="showPassword">
            <mat-icon>{{showPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="password?.invalid && password?.touched">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
          </mat-error>
        </mat-form-field>

        <!-- Remember Me & Forgot Password -->
        <div class="form-options">
          <mat-checkbox formControlName="rememberMe" class="remember-checkbox">
            Remember me
          </mat-checkbox>
          <a routerLink="/auth/forget-password" class="forgot-password">Forgot password?</a>
        </div>

        <!-- Sign In Button -->
        <button mat-raised-button color="primary" type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading">Signing In...</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-text">Or continue with</span>
      </div>

      <!-- Google Login -->
      <button mat-stroked-button type="button" (click)="onGoogleLogin()" class="btn-google">
        <img src="assets/svg/google.svg" alt="Google" class="google-icon">
        <span>Continue with Google</span>
      </button>

      <!-- Secure Connection -->
      <div class="secure-indicator">
        <img src="assets/svg/secure.svg" alt="Secure" class="secure-icon">
        <span>Secure & encrypted connection</span>
      </div>

      <!-- Sign Up Link -->
      <div class="signup-link">
        <span>New to ShopHub?</span>
        <a routerLink="/auth/signup" class="link">Create an account</a>
      </div>
    </div>
  </div>
</div>
