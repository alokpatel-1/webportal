<div class="onboard-container">
    <div class="onboard-card">
        <div class="onboard-header">
            <h1 class="onboard-title">Register as Shop Admin</h1>
            <p class="onboard-subtitle">Empower your shop with Livo's management tools.</p>
        </div>

        <form class="onboard-form">
            <!-- Onboarding form fields will go here -->
            <div class="form-group">
                <label for="shopName">Shop Name</label>
                <input type="text" id="shopName" class="form-control" placeholder="Enter your shop name">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Start Onboarding</button>
            </div>
        </form>

        <div class="onboard-footer">
            <p>Already have an account? <a routerLink="/">Go back to home</a></p>
        </div>
    </div>
</div>
