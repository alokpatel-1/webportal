<aside class="sidebar">
  <h2 class="sidebar__title">{{ title }}</h2>
  <nav class="sidebar__nav">
    @for (item of items; track item.route) {
      <a [routerLink]="item.route" routerLinkActive="sidebar__link--active" class="sidebar__link">
        {{ item.label }}
      </a>
    }
  </nav>
</aside>
