<form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
        <label>FULL NAME</label>
        <div class="input-wrapper">
            <i class="pi pi-user input-icon"></i>
            <input type="text" pInputText placeholder="John Doe" formControlName="name" class="custom-input">
        </div>
        <small class="error-msg" *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched">
            Name must be at least 2 characters
        </small>
    </div>

    <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <div class="input-wrapper">
            <i class="pi pi-envelope input-icon"></i>
            <input type="email" pInputText placeholder="you@company.com" formControlName="email" class="custom-input">
        </div>
        <small class="error-msg" *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
            Valid email is required
        </small>
    </div>

    <div class="form-group">
        <label>PASSWORD</label>
        <div class="input-wrapper">
            <i class="pi pi-lock input-icon"></i>
            <input [type]="showPassword ? 'text' : 'password'" pInputText placeholder="Create a password" formControlName="password" class="custom-input">
            <i class="pi input-icon-right" [ngClass]="showPassword ? 'pi-eye-slash' : 'pi-eye'" (click)="togglePasswordVisibility()"></i>
        </div>
        <small class="error-msg" *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
            Password must be at least 6 characters
        </small>
    </div>

    <div class="form-group">
        <label>CONFIRM PASSWORD</label>
        <div class="input-wrapper">
            <i class="pi pi-lock input-icon"></i>
            <input [type]="showConfirmPassword ? 'text' : 'password'" pInputText placeholder="Confirm your password" formControlName="confirmPassword" class="custom-input">
            <i class="pi input-icon-right" [ngClass]="showConfirmPassword ? 'pi-eye-slash' : 'pi-eye'" (click)="toggleConfirmPasswordVisibility()"></i>
        </div>
        <small class="error-msg" *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched">
            Please confirm your password
        </small>
        <small class="error-msg" *ngIf="signupForm.errors?.['passwordMismatch'] && signupForm.get('confirmPassword')?.touched">
            Passwords do not match
        </small>
    </div>

    <button pButton type="submit" label="Create Account" icon="pi pi-arrow-right" iconPos="right" class="submit-btn"></button>

    <div class="auth-footer">
        Already have an account? <a (click)="switchToLogin.emit()" class="link-highlight">Sign In</a>
    </div>
</form>
