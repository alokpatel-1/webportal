<form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
    <p class="auth-description">Enter your email address and we'll send you a link to reset your password.</p>

    <div class="form-group">
        <label>EMAIL ADDRESS</label>
        <div class="input-wrapper">
            <i class="pi pi-envelope input-icon"></i>
            <input type="email" pInputText placeholder="you@company.com" formControlName="email" class="custom-input">
        </div>
        <small class="error-msg" *ngIf="forgotPasswordForm.get('email')?.invalid && forgotPasswordForm.get('email')?.touched">
            Valid email is required
        </small>
    </div>

    <button pButton type="submit" label="Send Reset Link" icon="pi pi-send" iconPos="right" class="submit-btn"></button>

    <div class="auth-footer">
        Back to <a (click)="switchToLogin.emit()" class="link-highlight">Sign In</a>
    </div>
</form>
