<div class="product-list-container section-padding">
    <div class="section-header">
        <h1 class="section-title">All Products</h1>
        <p class="section-subtitle">Browse our complete collection of premium products.</p>
    </div>

    <p-dataView #dv [value]="products" [paginator]="true" [rows]="12" layout="grid">
        <ng-template let-product pTemplate="gridItem">
            <div class="col-12 md:col-4 lg:col-3 p-2">
                <div class="product-card p-4 border-round shadow-1">
                    <div class="relative mb-3">
                        <img [src]="product.image" [alt]="product.name" class="product-image">
                        <p-tag [value]="product.inventoryStatus" [severity]="getSeverity(product)" class="absolute top-0 right-0 m-2"></p-tag>
                    </div>
                    <div class="flex flex-column align-items-start gap-2">
                        <div class="text-xl font-bold">{{ product.name }}</div>
                        <div class="flex align-items-center gap-2">
                            <i class="pi pi-tag text-sm text-gray-500"></i>
                            <span class="text-sm font-semibold text-gray-500">{{ product.category }}</span>
                        </div>
                    </div>
                    <div class="flex align-items-center justify-content-between mt-4">
                        <span class="text-2xl font-bold text-brand-primary">{{ product.price | currency }}</span>
                        <p-button icon="pi pi-shopping-cart" styleClass="p-button-rounded"></p-button>
                    </div>
                </div>
            </div>
        </ng-template>
    </p-dataView>
</div>
